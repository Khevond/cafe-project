version: "3.9"

services:
  backend:
    build: ./backend
    container_name: cafe_backend
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: cafe_front
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

